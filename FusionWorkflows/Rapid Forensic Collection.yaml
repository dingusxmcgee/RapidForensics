# This is an exported workflow. Editing this file is not recommended.

name: Rapid Forensic Collection
trigger:
    next:
        - 34description_includes_overwatch3434tactic_is_equal_to_falcon_overwatch3434severity_is_equal_to_crit
    event: Investigatable/EPP
    name: Detection > EPP Detection
    type: Signal
actions:
    AddCommentToDetection:
        id: 7b77cb5d5ff2651cc51c7c4c610d54d1
        default_name: Add comment to detection
        name: Add comment to detection
        next:
            - CreateCollectionCompleteVariable
        properties:
            comment: Rapid Forensics Collection Started ${data['Workflow.Execution.Time.Date']}
            investigatable_id: ${Trigger.Category.Investigatable.InvestigatableID}
        version_constraint: ~0
    CreateCollectionCompleteVariable:
        id: 702d15788dbbffdf0b68d8e2f3599aa4
        default_name: Create variable
        class: CreateVariable
        name: Create collection_complete variable
        next:
            - SetCollectionCompleteToDefaultFalse
        properties:
            variable_schema:
                properties:
                    collection_complete:
                        type: boolean
                type: object
        version_constraint: ~1
    CreateCollectorRunningVariable:
        id: 702d15788dbbffdf0b68d8e2f3599aa4
        default_name: Create variable
        class: CreateVariable
        name: Create collector_running variable
        next:
            - GetDeviceDetails
        properties:
            variable_schema:
                properties:
                    collector_running:
                        type: boolean
                type: object
        version_constraint: ~1
    CreateLogfilePathVariable:
        id: 702d15788dbbffdf0b68d8e2f3599aa4
        default_name: Create variable
        class: CreateVariable
        name: Create logfile_path variable
        next:
            - WhileCollectionCompleteIsEqualToFalse
        properties:
            variable_schema:
                properties:
                    logfile_path:
                        type: string
                type: object
        version_constraint: ~1
    CreateRemoveZipChoiceVariable:
        id: 702d15788dbbffdf0b68d8e2f3599aa4
        default_name: Create variable
        class: CreateVariable
        name: Create remove_zip_choice variable
        next:
            - SetRemoveZipChoiceDefaultFalse
        properties:
            variable_schema:
                properties:
                    remove_zip_choice:
                        type: boolean
                type: object
        version_constraint: ~1
    CreateTimeVariables:
        id: 702d15788dbbffdf0b68d8e2f3599aa4
        default_name: Create variable
        class: CreateVariable
        name: Create time variables
        next:
            - CreateLogfilePathVariable
        properties:
            variable_schema:
                properties:
                    azure_upload_time:
                        type: string
                    total_collection_time:
                        type: string
                type: object
        version_constraint: ~1
    EmailCollectorAlreadyRanOrRunning:
        id: 07413ef9ba7c47bf5a242799f59902cc
        default_name: Send email
        name: Email - collector already ran or running
        properties:
            msg: "Collector would have run on host: \n\nHostName: ${data['GetDeviceDetails.Hostname']} \naid: ${data['Trigger.Category.Investigatable.Product.EPP.Sensor.SensorID']}\n\nHowever Collector is either already running or was run within 24 hours. See below for more details: \n\nCollector Currently Running: ${data['WorkflowCustomVariable.collector_running']}\nCollector Execution count in last 24 hours: ${data['HasCollectorExecutedInLast24Hours.event_count']}"
            msg_type: text
            subject: Forensic Collector failed to execute on ${data['GetDeviceDetails.Hostname']}
            to:
                - YOUR_EMAIL@example.com
        version_constraint: ~1
    GetDeviceDetails:
        id: 6265dc947cc2252f74a5f25261ac36a9
        default_name: Get device details
        name: Get device details
        next:
            - platform_is_equal_to_windows
        properties:
            device_id: ${Trigger.Category.Investigatable.Product.EPP.Sensor.SensorID}
        version_constraint: ~1
    GetLogFile:
        id: 3bf73d1e9ee83b1d507c333680fc3d94
        default_name: Get file
        continue_on_error: true
        name: Get log file
        next:
            - file_size_is_greater_than_0
        properties:
            device_id: ${Trigger.Category.Investigatable.Product.EPP.Sensor.SensorID}
            file_path: ${data['WorkflowCustomVariable.logfile_path']}
        version_constraint: ~2
    HasCollectorExecutedInLast24Hours:
        id: cdf5c3e0d69f156eaaf56c1f5d3f1b66
        default_name: Workflow-specific event query
        inline_configuration:
            input_schema:
                $schema: https://json-schema.org/draft-07/schema
                properties:
                    aid:
                        type: string
                        title: Aid
                        default: '*'
                required:
                    - aid
                type: object
                description: Generated request schema
            config:
                description: query for previously executed forensic collectors
                end: now
                last_modified_by: john.mccarthy@danaher.com
                last_modified_timestamp: "2026-04-30T19:14:15.889Z"
                repo_or_view: search-all
                search_name: Offline Forensic Collector Process Query
                search_query: |
                    #event_simpleName = /\AProcessRollup/i AND aid = ?aid AND FileName=-RapidForensics-Collector* | rename(field=@timestamp, as=event_time) | rename(field=#event_simpleName, as=event_simpleName) | rename(field=UserSid, as=UserSid_readable) | table([FileName, FilePath, SHA256HashData, RawProcessId, TargetProcessId, ParentProcessId, UserName, UserSid_readable, CommandLine, event_time])
                search_query_args:
                    aid: '*'
                start: 24h
                tags: []
        class: Inline.QueryEvent
        name: has collector executed in last 24 hours
        next:
            - event_count_is_equal_to_0
        properties:
            aid: ${data['Trigger.Category.Investigatable.Product.EPP.Sensor.SensorID']}
            logscale_search_end_time: now
            logscale_search_start_time: 1 day
            output_files_only: false
            workflow_csv_header_fields: []
            workflow_export_event_query_results_to_csv: false
        version_constraint: ~1
    PutAndRunForensicCollector:
        id: a29b38809708ffc5fb18a03676520b1a
        default_name: Put and run file
        name: Put and run forensic collector
        next:
            - SendInitialEmail
        properties:
            device_id: ${Trigger.Category.Investigatable.Product.EPP.Sensor.SensorID}
            file_name: YOUR_OFFLINE_COLLECTOR.exe
            queue_offline: true
    RequestHumanInputSendEmail:
        id: d6731c10b24834e2e0f4bd9d390a29c8
        default_name: Request human input - Send email
        name: Request human input - Send email
        next:
            - human_response_is_equal_to_approve
        properties:
            allowed_responses:
                - Approve
                - Decline
            file_attachment: ${GetLogFile.file_info}
            msg: "Hostname: ${data['GetDeviceDetails.Hostname']}\naid: ${data['Trigger.Category.Investigatable.Product.EPP.Sensor.SensorID']}\nLast Login User: ${data['GetDeviceDetails.LastLoginUser']\nLocal IP: ${data['GetDeviceDetails.LocalIP']}\nDomain: ${data['GetDeviceDetails.MachineDomain']}\n\nTrigger information: \nCID: ${data['Trigger.CID']}\nSource: ${data['Trigger.TriggerSource']}\nSource User: ${data['Trigger.TriggerSource.User.Email']}\nSource IP: ${data['Trigger.TriggerIP']}\n\nCollection Info:\nCollection Complete: ${data['WorkflowCustomVariable.collection_complete']}\nAzure Upload Time: ${data['WorkflowCustomVariable.azure_upload_time']}\nTotal Collection Time: ${data['WorkflowCustomVariable.total_collection_time']}\n\nTo delete the forensic collection zip file, select approve.\nTo leave it on the host, select decline. \n\nThis choice will time out after 24 hours and the default action will leave the zip file on the host. \n\nAn attempt was made to upload the collection log file, and if available, is attached to this email. \nPassword is 'infected'. \nLog file is also available in the workflow execution log. \n\nIf log file collection was unsuccessful, the log file should remain on the host."
            msg_type: text
            skip_workflow_header: true
            subject: INPUT REQUIRED - Forensic Collector completed on host ${data['GetDeviceDetails.Hostname']}
            to:
                - YOUR_EMAIL@example.com
            user_input_timeout: 24h
        version_constraint: ~1
    SendInitialEmail:
        id: 07413ef9ba7c47bf5a242799f59902cc
        default_name: Send email
        name: Send initial email
        next:
            - AddCommentToDetection
        properties:
            msg: "Forensic collection started on following host:\n\nHostname: ${data['GetDeviceDetails.Hostname']}\naid: ${data['Trigger.Category.Investigatable.Product.EPP.Sensor.SensorID']}\nLast Login User: ${data['GetDeviceDetails.LastLoginUser']}\nLocal IP: ${data['GetDeviceDetails.LocalIP']}\nDomain: ${data['GetDeviceDetails.MachineDomain']}\n\nDetection information: \nSeverity: ${data['Trigger.Category.Investigatable.Severity']}\nDesccription: ${data['Trigger.Category.Investigatable.Description']}\nUserName: ${data['Trigger.Category.Investigatable.Product.EPP.Process.UserName']}\nProcess CmdLine: ${data['Trigger.Category.Investigatable.Product.EPP.Process.CommandLine']}\nParent Process Cmdline: ${data['Trigger.Category.Investigatable.Product.EPP.ParentProcess.CommandLine']}\nGrandParent Process CmdLine: ${data['Trigger.Category.Investigatable.Product.EPP.GrandParentProcess.CommandLine']}\n"
            msg_type: text
            subject: Forensic Collection executed on ${data['GetDeviceDetails.Hostname']}
            to:
                - YOUR_EMAIL@example.com
        version_constraint: ~1
    SetCollectionCompleteToDefaultFalse:
        id: 6c6eab39063fa3b72d98c82af60deb8a
        default_name: Update variable
        class: UpdateVariable
        name: set collection_complete to default false
        next:
            - CreateTimeVariables
        properties:
            WorkflowCustomVariable:
                collection_complete: false
        version_constraint: ~1
    SetCollectorRunningToFalse:
        id: 6c6eab39063fa3b72d98c82af60deb8a
        default_name: Update variable
        class: UpdateVariable
        name: set collector_running to false
        next:
            - HasCollectorExecutedInLast24Hours
        properties:
            WorkflowCustomVariable:
                collector_running: false
        version_constraint: ~1
    SetCollectorRunningToTrue:
        id: 6c6eab39063fa3b72d98c82af60deb8a
        default_name: Update variable
        class: UpdateVariable
        name: set collector_running to true
        next:
            - EmailCollectorAlreadyRanOrRunning
        properties:
            WorkflowCustomVariable:
                collector_running: true
        version_constraint: ~1
    SetRemoveZipChoiceDefaultFalse:
        id: 6c6eab39063fa3b72d98c82af60deb8a
        default_name: Update variable
        class: UpdateVariable
        name: set remove_zip_choice default false
        next:
            - RequestHumanInputSendEmail
        properties:
            WorkflowCustomVariable:
                remove_zip_choice: false
        version_constraint: ~1
    IsForensicCollectorRunningWIN:
        id: a29e7f62269745bd9799fa0a789d40a3_5c32f8f9c20011f1a0dc125183a56960_5b4b163dcb334059b7a25b2b3f56a43f
        default_name: _IsForensicCollectorRunning - WIN
        name: _IsForensicCollectorRunning - WIN
        next:
            - for_is_running_is_equal_to_false
        properties:
            csfusion_rtr_timeout: 120
            device_id: ${Trigger.Category.Investigatable.Product.EPP.Sensor.SensorID}
        version_constraint: ~0
    RemoveForensicCollectorLogFileWIN:
        id: a29e7f62269745bd9799fa0a789d40a3_f1505104466d11f186863ed2f9620966_5b4b163dcb334059b7a25b2b3f56a43f
        default_name: -RemoveForensicCollectorLogFile - WIN
        name: -RemoveForensicCollectorLogFile - WIN
        next:
            - CreateRemoveZipChoiceVariable
        properties:
            csfusion_rtr_timeout: 120
            device_id: ${Trigger.Category.Investigatable.Product.EPP.Sensor.SensorID}
            queue_offline: false
        version_constraint: ~0
    RemoveForensicCollectorLogFileWIN2:
        id: a29e7f62269745bd9799fa0a789d40a3_f1505104466d11f186863ed2f9620966_5b4b163dcb334059b7a25b2b3f56a43f
        default_name: -RemoveForensicCollectorLogFile - WIN
        name: -RemoveForensicCollectorLogFile - WIN - 2
        next:
            - PutAndRunForensicCollector
        properties:
            csfusion_rtr_timeout: 120
            device_id: ${Trigger.Category.Investigatable.Product.EPP.Sensor.SensorID}
            queue_offline: false
        version_constraint: ~0
    RemoveForensicCollectorZipFileWIN:
        id: a29e7f62269745bd9799fa0a789d40a3_92bb481d463b11f1938f266bafb7cbdd_5b4b163dcb334059b7a25b2b3f56a43f
        default_name: -RemoveForensicCollectorZipFile - WIN
        name: -RemoveForensicCollectorZipFile - WIN
        properties:
            csfusion_rtr_timeout: 120
            device_id: ${Trigger.Category.Investigatable.Product.EPP.Sensor.SensorID}
            queue_offline: true
        version_constraint: ~0
    TimeoutSetRemoveZipChoiceFalse:
        id: 6c6eab39063fa3b72d98c82af60deb8a
        default_name: Update variable
        class: UpdateVariable
        name: timeout set remove_zip_choice false
        properties:
            WorkflowCustomVariable:
                remove_zip_choice: false
        version_constraint: ~1
    UserSetRemoveZipChoiceFalse:
        id: 6c6eab39063fa3b72d98c82af60deb8a
        default_name: Update variable
        class: UpdateVariable
        name: user set remove_zip_choice false
        properties:
            WorkflowCustomVariable:
                remove_zip_choice: false
        version_constraint: ~1
    UserSetRemoveZipChoiceTrue:
        id: 6c6eab39063fa3b72d98c82af60deb8a
        default_name: Update variable
        class: UpdateVariable
        name: user set remove_zip_choice true
        next:
            - RemoveForensicCollectorZipFileWIN
        properties:
            WorkflowCustomVariable:
                remove_zip_choice: true
        version_constraint: ~1
conditions:
    34description_includes_overwatch3434tactic_is_equal_to_falcon_overwatch3434severity_is_equal_to_crit:
        next:
            - CreateCollectorRunningVariable
        expression: (Trigger.Category.Investigatable.Description:['Overwatch']),(Trigger.Category.Investigatable.Product.EPP.Behavior.TacticName:'Falcon Overwatch'),(Trigger.Category.Investigatable.Severity:5)
        display:
            - '[[&#34;Description includes Overwatch&#34;],[&#34;Tactic is equal to Falcon Overwatch&#34;],[&#34;Severity is equal to Critical&#34;]]'
    34file_size_is_equal_to_03434standard_error_exists34:
        next:
            - CreateRemoveZipChoiceVariable
        expression: (GetLogFile.file_info.Size:0),(GetLogFile.stderr:!null)
        display:
            - '[[&#34;File Size is equal to 0&#34;],[&#34;Standard error exists&#34;]]'
    event_count_is_equal_to_0:
        next:
            - RemoveForensicCollectorLogFileWIN2
        expression: HasCollectorExecutedInLast24Hours.event_count:0
        display:
            - Event count is equal to 0
        else_if: event_count_is_greater_than_0
    event_count_is_greater_than_0:
        next:
            - EmailCollectorAlreadyRanOrRunning
        expression: HasCollectorExecutedInLast24Hours.event_count:>0
        display:
            - Event count is greater than 0
    file_size_is_greater_than_0:
        next:
            - RemoveForensicCollectorLogFileWIN
        expression: GetLogFile.file_info.Size:>0
        display:
            - File Size is greater than 0
        else_if: 34file_size_is_equal_to_03434standard_error_exists34
    for_is_running_is_equal_to_false:
        next:
            - SetCollectorRunningToFalse
        expression: IsForensicCollectorRunningWIN.for_is_running:false
        display:
            - For is running is equal to False
        else_if: for_is_running_is_equal_to_true
    for_is_running_is_equal_to_true:
        next:
            - SetCollectorRunningToTrue
        expression: IsForensicCollectorRunningWIN.for_is_running:true
        display:
            - For is running is equal to True
    human_response_is_equal_to_approve:
        next:
            - UserSetRemoveZipChoiceTrue
        expression: RequestHumanInputSendEmail.result.user_response:'Approve'
        display:
            - Human response is equal to Approve
        else_if: human_response_is_equal_to_timed_out
    human_response_is_equal_to_decline:
        next:
            - UserSetRemoveZipChoiceFalse
        expression: RequestHumanInputSendEmail.result.user_response:'Decline'
        display:
            - Human response is equal to Decline
    human_response_is_equal_to_timed_out:
        next:
            - TimeoutSetRemoveZipChoiceFalse
        expression: RequestHumanInputSendEmail.result.user_response:'Timed out'
        display:
            - Human response is equal to Timed out
        else_if: human_response_is_equal_to_decline
    platform_is_equal_to_windows:
        next:
            - IsForensicCollectorRunningWIN
        expression: GetDeviceDetails.Platform:'Windows'
        display:
            - Platform is equal to Windows
loops:
    WhileCollectionCompleteIsEqualToFalse:
        display: While collection_complete is equal to False
        name: While collection_complete is equal to False
        next:
            - GetLogFile
        for:
            input: ""
            condition: WorkflowCustomVariable.collection_complete:false
            condition_display:
                - collection_complete is equal to False
            continue_on_partial_execution: false
            sequential: true
        trigger:
            next:
                - Sleep3Min
        actions:
            SetCollectionCompleteToFalse:
                id: 6c6eab39063fa3b72d98c82af60deb8a
                default_name: Update variable
                class: UpdateVariable
                name: set collection_complete to false
                properties:
                    WorkflowCustomVariable:
                        collection_complete: false
                version_constraint: ~1
            SetCollectionCompleteToTrue:
                id: 6c6eab39063fa3b72d98c82af60deb8a
                default_name: Update variable
                class: UpdateVariable
                name: set collection_complete to true
                next:
                    - UpdateLogfileAndTimeVariables
                properties:
                    WorkflowCustomVariable:
                        collection_complete: true
                version_constraint: ~1
            Sleep3Min:
                id: 4f1af1ae4c13dc1e3bcd725f8dc0f63b
                default_name: Sleep
                name: Sleep 3 min
                next:
                    - IsForensicCollectorCompletedWIN
                properties:
                    sleep_time: 3m
                version_constraint: ~1
            IsForensicCollectorCompletedWIN:
                id: a29e7f62269745bd9799fa0a789d40a3_2695352c459311f1bc1a7689f2c8329e_5b4b163dcb334059b7a25b2b3f56a43f
                default_name: -IsForensicCollectorCompleted - WIN
                name: -IsForensicCollectorCompleted - WIN
                next:
                    - collection_complete_is_equal_to_true
                properties:
                    csfusion_rtr_timeout: 120
                    device_id: ${Trigger.Category.Investigatable.Product.EPP.Sensor.SensorID}
                version_constraint: ~0
            UpdateLogfileAndTimeVariables:
                id: 6c6eab39063fa3b72d98c82af60deb8a
                default_name: Update variable
                class: UpdateVariable
                name: Update logfile and time variables
                properties:
                    WorkflowCustomVariable:
                        azure_upload_time: ${data['IsForensicCollectorCompletedWIN.azure_upload_time']}
                        logfile_path: ${data['IsForensicCollectorCompletedWIN.logfile_path']}
                        total_collection_time: ${data['IsForensicCollectorCompletedWIN.completed_total']}
                version_constraint: ~1
        conditions:
            collection_complete_is_equal_to_false:
                next:
                    - SetCollectionCompleteToFalse
                expression: IsForensicCollectorCompletedWIN.collection_complete:false
                display:
                    - Collection complete is equal to False
            collection_complete_is_equal_to_true:
                next:
                    - SetCollectionCompleteToTrue
                expression: IsForensicCollectorCompletedWIN.collection_complete:true
                display:
                    - Collection complete is equal to True
                else_if: collection_complete_is_equal_to_false
        output_fields:
            - WorkflowCustomVariable.collection_complete
            - IsForensicCollectorCompletedWIN.azure_end_time
            - IsForensicCollectorCompletedWIN.azure_start_time
            - IsForensicCollectorCompletedWIN.azure_upload_time
            - IsForensicCollectorCompletedWIN.collection_complete
            - IsForensicCollectorCompletedWIN.completed_time
            - IsForensicCollectorCompletedWIN.completed_total
            - IsForensicCollectorCompletedWIN.logfile_path
            - IsForensicCollectorCompletedWIN.stdout
